spring.application.name=lawvoice-backend
server.port=${PORT:8082}

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5170}

# Database Configuration (H2 in-memory database for local dev, PostgreSQL when JDBC_DATABASE_URL is set)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:lawvoicedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${JDBC_DATABASE_DRIVER:org.h2.Driver}

# JPA/Hibernate properties
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
