services:
  backend:
    build: ./backend
    container_name: lawvoice-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      FRONTEND_ORIGIN: http://localhost:5190
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_MODEL: ${SARVAM_MODEL:-sarvam-105b}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: lawvoice-frontend
    ports:
      - "5190:80"
    depends_on:
      - backend
    restart: unless-stopped

